<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  FİGÂNÎ – BEN YAZMADIM!   (Tarihle Şaka Olmaz · 2)
//  Bütün metinler veri.json'dan gelir; seslendirilen her replik oradadır.
// =====================================================================
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const W=960,H=540;let SC=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;const d=Math.min(2,window.devicePixelRatio||1);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);SC=cv.width/W;}
addEventListener('resize',resize);resize();
const TAU=Math.PI*2,PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,choice=a=>a[Math.random()*a.length|0];
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const distE=(a,b)=>Math.hypot(a.x-b.x,(a.y-b.y)*1.25);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const OL='#2b1a10',FONT='"Trebuchet MS","Segoe UI",Verdana,sans-serif';

// ---------------- INPUT ----------------
const keys={};let pressed={};
const ptr={x:0,y:0,down:false,tap:false,onBtn:false,abil:false};
const ABTN={x:W-80,y:H-86,r:48};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;AU.init();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;});
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();const p=toGame(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;ptr.tap=true;
 ptr.onBtn=state==='stage'&&Math.hypot(p.x-ABTN.x,p.y-ABTN.y)<ABTN.r+10;if(ptr.onBtn)ptr.abil=true;});
cv.addEventListener('pointermove',e=>{const p=toGame(e);ptr.x=p.x;ptr.y=p.y;});
addEventListener('pointerup',()=>{ptr.down=false;ptr.onBtn=false;});
addEventListener('pointercancel',()=>{ptr.down=false;ptr.onBtn=false;});
const hit=(...c)=>c.some(k=>pressed[k]);
const inBox=(b)=>ptr.x>=b.x&&ptr.x<=b.x+b.w&&ptr.y>=b.y&&ptr.y<=b.y+b.h;

// ---------------- AUDIO (sentez + kayıtlı efektler) ----------------
const AU={c:null,muted:false,
init(){if(this.c){if(this.c.state==='suspended')this.c.resume();return;}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const c=this.c=new AC();
 this.m=c.createGain();this.m.gain.value=this.muted?0:.55;this.m.connect(c.destination);
 this.s=c.createGain();this.s.gain.value=.9;this.s.connect(this.m);
 this.fx=c.createGain();this.fx.gain.value=.75;this.fx.connect(this.m);loadSFX(c);AMBI.load(c);
 const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
 if(MUS.want)MUS.start(MUS.want);
},
toggle(){this.muted=!this.muted;if(this.m)this.m.gain.value=this.muted?0:.55;if(this.muted){VO.hush();BGM.pause();}else BGM.resume();toast(this.muted?'Ses kapalı (M)':'Ses açık (M)');},
tone(type,f0,f1,dur,vol=.3,delay=0,dest){const c=this.c;if(!c)return null;const t=c.currentTime+Math.max(0,delay);const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.02,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||this.s);o.start(t);o.stop(t+dur+.05);return o;},
noise(dur,vol,ft,f0,f1,delay=0,q=1,dest){const c=this.c;if(!c)return;const t=c.currentTime+Math.max(0,delay);const src=c.createBufferSource();src.buffer=this.nb;src.loop=true;const f=c.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f);f.connect(g);g.connect(dest||this.s);src.start(t,Math.random()*.5);src.stop(t+dur+.05);},
voice(dur,pitch){const c=this.c,t=c.currentTime;const o=c.createOscillator();o.type='sawtooth';const base=170*pitch;o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.8,t+dur*.3);o.frequency.linearRampToValueAtTime(base*1.5,t+dur*.7);o.frequency.linearRampToValueAtTime(base*.9,t+dur);const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(1300,t+dur*.4);f.frequency.linearRampToValueAtTime(600,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.setValueAtTime(.4,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(this.s);o.start(t);o.stop(t+dur+.05);},
play(n){if(!this.c)return;if(SFXB[n]&&SFXB[n].length){const src=this.c.createBufferSource();src.buffer=choice(SFXB[n]);src.connect(this.fx);src.start();return;}const r=Math.random;switch(n){
 case 'kagit':this.noise(.09,.32,'bandpass',2500,5200,0,1.2);this.noise(.12,.22,'highpass',3000,6000,.07);break;
 case 'kalem':for(let i=0;i<5;i++)this.noise(.05+r()*.04,.16,'highpass',3500,5500,i*.075,2);break;
 case 'gong':this.tone('sine',98,94,2.8,.5);this.tone('sine',147,140,2.2,.22);this.tone('sine',262,250,1.6,.1);this.noise(.4,.2,'lowpass',900,200);break;
 case 'whistle':{const o=this.tone('square',2300,2300,.55,.05);if(o){const l=this.c.createOscillator(),lg=this.c.createGain();l.frequency.value=28;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);l.start();l.stop(this.c.currentTime+.65);}break;}
 case 'boing':this.tone('sine',160,640,.38,.45);this.tone('triangle',320,1280,.3,.08);break;
 case 'dash':this.noise(.28,.4,'bandpass',300,3500,0,2);break;
 case 'bonk':this.tone('sine',520+r()*120,70,.2,.5);this.noise(.07,.35,'lowpass',2500,400);break;
 case 'gasp':this.voice(.25,1.3);break;
 case 'fanfare':[523,659,784,1046,784,1046].forEach((f,i)=>this.tone('square',f,f,i==5?.6:.14,.12,i*.13));break;
 case 'sad':[392,370,349,330].forEach((f,i)=>this.tone('sawtooth',f,i==3?f*.94:f,i==3?1.1:.38,.13,i*.42));break;
 case 'drum':this.tone('sine',110,45,.25,.5);this.noise(.08,.2,'lowpass',1200,300);this.tone('sine',110,45,.25,.4,.22);break;
 case 'stamp':this.tone('sine',90,40,.35,.8);this.noise(.18,.5,'lowpass',1500,200);break;
 case 'laugh':for(let i=0;i<7;i++){this.tone('sawtooth',300-i*14,240-i*14,.09,.2,i*.12);this.noise(.06,.15,'bandpass',900,1200,i*.12,3);}break;
 case 'slip':this.tone('sine',1000,140,.45,.25);break;
 case 'thud':this.tone('sine',140,40,.3,.6);this.noise(.3,.4,'lowpass',800,100);break;
 case 'yell':this.voice(.6,1.1);break;
 case 'clang':this.tone('square',1250,1180,.5,.1);this.tone('sine',2500,2380,.7,.12);this.noise(.1,.3,'highpass',3000,6000);break;
 case 'pop':this.tone('sine',500,1300,.09,.3);break;
}}};
// ---- kayıtlı ses efektleri (sfx/manifest.json); yoksa sentez çalar ----
const SFX_VER='f1',SFXB={};
function loadSFX(c){fetch('sfx/manifest.json?v='+SFX_VER).then(r=>r.ok?r.json():null).then(m=>{if(!m)return;for(const n in m)for(const f of [].concat(m[n]))fetch('sfx/'+f+'.mp3?v='+SFX_VER).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(a=>c.decodeAudioData(a)).then(b=>{(SFXB[n]=SFXB[n]||[]).push(b);}).catch(()=>{});}).catch(()=>{});}
// ---- resimler ----
const IMG={};for(const n of ['kapak','divan','son_iyi','son_kotu','tarih']){const im=new Image();im.src='img/'+n+'.jpg?v=1';IMG[n]=im;}
const imgOk=im=>im&&im.complete&&im.naturalWidth>0;
// ---- ortam sesleri ----
const AMBI={bufs:{},cur:null,src:null,g:null,
 load(c){for(const n of ['carsi','meydan','saray'])fetch('sfx/amb_'+n+'.mp3?v='+SFX_VER).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(a=>c.decodeAudioData(a)).then(b=>{this.bufs[n]=b;}).catch(()=>{});},
 want(n){const c=AU.c;if(!c||n===this.cur||(n&&!this.bufs[n]))return;const t=c.currentTime;
  if(this.src){const s=this.src,g=this.g;g.gain.setTargetAtTime(0,t,.5);setTimeout(()=>{try{s.stop();}catch(e){}},3000);}
  this.cur=n;this.src=null;this.g=null;if(!n)return;
  const s=c.createBufferSource();s.buffer=this.bufs[n];s.loop=true;const g=c.createGain();g.gain.value=0;g.gain.setTargetAtTime(.26,t,.7);s.connect(g);g.connect(AU.m);s.start();this.src=s;this.g=g;}};
function ambFor(){if(state==='stage'&&G)return G.B.amb||'carsi';if(state==='intro')return'meydan';if(state==='divan')return'saray';return null;}
// ---- seslendirme ----
AU.babble=function(text,pitch=1,rate=1){const c=this.c;if(!c||this.muted)return 0;
 const n=clamp(Math.round(text.replace(/[^a-zA-ZçğıöşüâîûÇĞİÖŞÜÂÎÛ]/g,'').length/3.4),2,11);
 const FM=[[730,1090],[300,2200],[320,870],[530,1840],[600,1000]];
 let t=c.currentTime+.02;const base=140*pitch,st=t;
 for(let i=0;i<n;i++){const d=(.07+Math.random()*.05)/rate;const o=c.createOscillator();o.type='sawtooth';
  const f0=base*(1+Math.sin(i*2.1+pitch)*.16)*(i===n-1?.85:1);o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*rand(.88,1.15),t+d);
  const fm=choice(FM),g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  for(const [fq,q] of [[fm[0],5],[fm[1],7]]){const b=c.createBiquadFilter();b.type='bandpass';b.Q.value=q;b.frequency.value=fq*(.8+pitch*.2);o.connect(b);b.connect(g);}
  g.connect(this.s);o.start(t);o.stop(t+d+.03);t+=d+.02/rate;}
 return t-st;};
// [perde, hız] — karakter anahtarları veri.json 'karakterler' ile aynı
const VP={fig:[1.15,1.2],anlatici:[.85,.95],pasa:[.6,.82],subasi:[.4,.9],muhafiz:[.8,1.1],sahaf:[.6,.85],teyze:[1.6,1.25],hattat:[1,1],cirak:[2,1.35],rakip:[1.2,1.1],kiz:[1.7,1.15]};
const VO_VER='f1';
const FEMALE_VO=new Set(['teyze','kiz']);
const VO={mode:(()=>{const v=localStorage.getItem('fig_vo');return v==null?2:+v;})(),tr:null,cur:0,until:0,man:null,aud:null,
 init(){fetch('voices/manifest.json?v='+VO_VER).then(r=>r.ok?r.json():null).then(m=>{this.man=m;}).catch(()=>{});
  if(!('speechSynthesis' in window))return;const pick=()=>{const vs=speechSynthesis.getVoices();this.tr=vs.find(v=>/^tr([-_]|$)/i.test(v.lang))||null;};pick();speechSynthesis.onvoiceschanged=pick;},
 label(){return this.mode===0?'Kapalı':this.mode===1?'Mırıltı':this.man?'Karakter sesleri':(this.tr?'Gerçek ses':'Gerçek ses (Türkçe ses yok, mırıltı)');},
 hush(){if(this.aud)this.aud.pause();if(window.speechSynthesis)speechSynthesis.cancel();this.until=0;},
 cycle(){this.mode=this.mode===0?2:this.mode-1;localStorage.setItem('fig_vo',this.mode);if(this.mode<2)this.hush();},
 busy(){const now=performance.now();if(this.aud&&!this.aud.paused&&!this.aud.ended)return true;if(window.speechSynthesis&&speechSynthesis.speaking&&now<this.until+9000)return true;return now<this.until;},
 file(who,text){const e=this.man&&this.man[text];if(!e)return null;if(typeof e==='string')return e;
  if(Array.isArray(e)){const [f,o,ff]=e;return(!o&&ff&&FEMALE_VO.has(who))?ff:f;}
  if(typeof e==='object')return e[who]||e.id||Object.values(e)[0]||null;return null;},
 speak(who,text,pri=1){if(!this.mode||AU.muted||!AU.c)return;text=String(text);if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(text))return;
  const p=VP[who]||VP.anlatici,now=performance.now(),busy=this.busy();
  if(busy&&pri<=this.cur)return;
  const f=this.mode===2?this.file(who,text):null;
  if(f){this.hush();const a=new Audio('voices/'+f+'.mp3?v='+VO_VER);a.volume=1;a.play().catch(()=>{});this.aud=a;this.cur=pri;this.until=now+400;return;}
  if(this.aud)this.aud.pause();
  if(this.mode===2&&this.tr){const ss=speechSynthesis;ss.cancel();
   const u=new SpeechSynthesisUtterance(text.replace(/[→•…"‘’]/g,' ').toLocaleLowerCase('tr-TR'));u.voice=this.tr;u.lang=this.tr.lang;u.pitch=clamp(p[0],0,2);u.rate=clamp(p[1],.5,2);u.volume=1;this.cur=pri;this.until=now+400;ss.speak(u);return;}
  this.cur=pri;this.until=now+AU.babble(text,.35+p[0]*.65,p[1])*1000;}
};
VO.init();
// ---- müzik (muzik/*.mp3) ----
const BGM={map:{title:'baslik',intro:'baslik',stage:'kovala',divan:'divan',son:'son'},
 els:{},cur:null,el:null,vol:.42,duck:1,
 key(n){return n?this.map[n]||null:null;},
 get(k){if(!this.els[k]){const a=new Audio('muzik/'+k+'.mp3');a.loop=k!=='son';a.preload='auto';a.addEventListener('error',()=>{a._bad=1;});this.els[k]=a;}return this.els[k];},
 play(n){const k=this.key(n);if(k&&k===this.cur&&this.el&&!this.el.paused)return;if(k!==this.cur)this.fadeOut();this.cur=k;this.el=null;if(!k)return;
  const a=this.get(k);this.el=a;if(a._bad)return;if(k==='son'&&(a.ended||a.paused))a.currentTime=0;if(a.paused)a.volume=0;if(!AU.c||AU.muted)return;a.play().catch(()=>{});},
 fadeOut(){const a=this.el;if(!a||a.paused)return;const v0=a.volume;let i=0;const id=setInterval(()=>{i++;a.volume=Math.max(0,v0*(1-i/20));if(i>=20){clearInterval(id);if(a!==this.el)a.pause();}},50);},
 stop(){this.fadeOut();this.cur=null;this.el=null;},
 tick(dt){const a=this.el;if(!a)return;let t=this.vol*this.duck;if(this.cur==='son'&&a.duration&&a.duration-a.currentTime<4)t*=clamp((a.duration-a.currentTime)/4,0,1);a.volume=clamp(a.volume+(t-a.volume)*Math.min(1,dt*2.5),0,1);},
 resume(){if(this.el&&this.el.paused&&!AU.muted&&!this.el._bad&&!(this.cur==='son'&&this.el.ended))this.el.play().catch(()=>{});},pause(){if(this.el)this.el.pause();}};
const MUS={want:null,start(n){this.want=n;BGM.play(n);},stop(){this.want=null;BGM.stop();}};

// ---------------- VERİ ----------------
let V=null,loadErr=false;
const SAVE=(()=>{let s={};try{s=JSON.parse(localStorage.getItem('fig_save')||'{}');}catch(e){}return Object.assign({best:0,unl:1,runs:0,iyi:0},s);})();
function save(){try{localStorage.setItem('fig_save',JSON.stringify(SAVE));}catch(e){}}
let TOASTS=[];
function toast(t){TOASTS.push({t,life:3.4});if(TOASTS.length>5)TOASTS.shift();}

// ---------------- ÇİZİM TEMELLERİ ----------------
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);if(c)ctx.fillStyle=c;ctx.fill();}
function ell(x,y,rx,ry,c,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,Math.abs(rx)),Math.max(.1,Math.abs(ry)),rot,0,TAU);if(c)ctx.fillStyle=c;ctx.fill();}
function ln(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function drawStar(x,y,r,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<10;i++){const a=i*PI/5-PI/2,q=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
function txt(s,x,y,size,color='#fff',align='center',stroke=OL,lw,style='bold'){ctx.font=`${style} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';if(stroke){ctx.lineWidth=lw||Math.max(3,size/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function wrap(text,maxW,font){ctx.font=font;const words=String(text).split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function shadow(x,y,r,z=0){const k=1/(1+z/60);ell(x,y,r*1.25*k,r*.45*k,'rgba(0,0,0,.22)');}
function heart(x,y,s,on){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-14,-4,-8,-14,0,-6);ctx.bezierCurveTo(8,-14,14,-4,0,6);ctx.closePath();ctx.fillStyle=on?'#e74c3c':'rgba(255,255,255,.18)';ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();if(on){ctx.fillStyle='rgba(255,255,255,.55)';ell(-4,-5,2.5,1.6);}ctx.restore();}
function bar(x,y,w,h,v,col,label){rr(x,y,w,h,h/2);ctx.fillStyle='rgba(255,240,210,.22)';ctx.fill();if(v>0){rr(x+2,y+2,(w-4)*clamp(v,0,1),h-4,(h-4)/2);ctx.fillStyle=col;ctx.fill();}rr(x,y,w,h,h/2);ctx.strokeStyle='rgba(255,230,180,.7)';ctx.lineWidth=1.5;ctx.stroke();if(label)txt(label,x+w/2,y+h/2+1,Math.min(14,h-4),'#fff','center',OL,3);}
function parchment(x=30,y=16,w=W-60,h=H-32){rr(x,y,w,h,18);ctx.fillStyle='#f3e2b8';ctx.fill();ctx.strokeStyle='#8a5a2b';ctx.lineWidth=6;ctx.stroke();rr(x+10,y+10,w-20,h-20,12);ctx.strokeStyle='rgba(138,90,43,.4)';ctx.lineWidth=2;ctx.stroke();}
function drawPaperShape(s=1,rot=0,open=false){ctx.save();ctx.rotate(rot);ctx.scale(s,s);ctx.strokeStyle=OL;ctx.lineWidth=1.5;
 rr(-9,-6.5,18,13,2);ctx.fillStyle='#fbf3dc';ctx.fill();ctx.stroke();
 if(!open){ell(-9,0,2.6,7,'#eadcb5');ctx.stroke();ell(9,0,2.6,7,'#eadcb5');ctx.stroke();}
 ctx.strokeStyle='#5a3a20';ctx.lineWidth=1;ctx.beginPath();for(const yy of [-2.5,1.5]){ctx.moveTo(-5,yy);for(let k=0;k<5;k++)ctx.quadraticCurveTo(-4+k*2,yy-1.5,-3+k*2,yy);}ctx.stroke();
 circ(5.5,4,1.7,'#c0392b');ctx.restore();}

 updFX(dt);
}
function drawToasts(){ctx.setTransform(SC,0,0,SC,0,0);TOASTS.slice(-4).forEach((t,i)=>{const age=3.4-t.life,k=Math.min(1,age*5),y=90+i*44;ctx.globalAlpha=Math.min(1,t.life*3);ctx.save();ctx.translate(lerp(340,0,k),0);
 rr(W-340,y,326,36,12);ctx.fillStyle='rgba(30,20,10,.85)';ctx.fill();ctx.strokeStyle='#e3b23c';ctx.lineWidth=2;ctx.stroke();ctx.font=`bold 14px ${FONT}`;const tt=wrap(t.t,300,ctx.font)[0];txt(tt,W-326,y+18,14,'#ffe066','left',null);ctx.restore();});ctx.globalAlpha=1;}
function render(){
 const calm=state==='tarih'||state==='summary';const sx=calm?0:(Math.random()-.5)*shake,sy=calm?0:(Math.random()-.5)*shake;
 ctx.setTransform(SC,0,0,SC,sx*SC,sy*SC);
 ctx.fillStyle='#000';ctx.fillRect(-20,-20,W+40,H+40);
 switch(state){
  case 'load':ctx.fillStyle='#2a1a10';ctx.fillRect(0,0,W,H);txt(loadErr?'veri.json yüklenemedi. Oyunu bir sunucu üzerinden açın.':'Yükleniyor...',W/2,H/2,22,'#ffd166');break;
  case 'title':drawTitle();break;
  case 'intro':drawIntro();break;
  case 'stage':drawStage();drawStageHUD();break;
  case 'divan':drawDivan();break;
  case 'ending':drawEnding();break;
  case 'tarih':drawTarih();break;
  case 'summary':drawSummary();break;
 }
 if(flash>0&&!calm){ctx.setTransform(SC,0,0,SC,0,0);ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
 drawToasts();drawMute();
}
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
 try{update(dt);render();}catch(err){console.error(err);}
 pressed={};ptr.tap=false;ptr.abil=false;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// ---- hata ayıklama kancası ----
function skipTo(x){if(!V)return'veri yok';const ix={stage1:0,stage2:1,stage3:2,0:0,1:1,2:2}[x];
 if(ix!=null){if(!RUN)newRun(ix);RUN.stage=ix;if(ix>0&&RUN.cleared<ix)RUN.cleared=ix;startStage(ix);}
 else if(x==='title')startTitle();
 else if(x==='intro'){newRun(0);startIntro();}
 else if(x==='clear'){if(state==='stage'&&G){G.card=null;G.got=G.B.hedef;startClear();}}
 else if(x==='pick'){if(state==='stage'&&G){G.card=null;G.clear=null;startPick();}}
 else if(x==='fail'){if(state==='stage'&&G){G.card=null;failStage('dedikodu');}}
 else if(x==='caught'){if(state==='stage'&&G){G.card=null;RUN.itibar=0;startCaught(G.guards[0]||P);}}
 else if(x==='divan'){if(!RUN)newRun(0);startDivan(false);}
 else if(x==='end'||x==='ending'||x==='end_iyi'){if(!RUN)newRun(0);if(!RUN.divan)RUN.divan={score:8,tot:8,res:'iyi'};startEnding('iyi');}
 else if(x==='end_kotu'){if(!RUN)newRun(0);RUN.divan={score:2,tot:2,res:'kotu'};startEnding('kotu');}
 else if(x==='tarih'){if(!RUN)newRun(0);startTarih();}
 else if(x==='summary'){if(!RUN)newRun(0);if(!RUN.divan)RUN.divan={score:7,tot:7,res:'iyi'};startSummary();}
 return state;}
window.__fg={state:()=>state,skip:skipTo,newRun,get G(){return G},get P(){return P},get RUN(){return RUN},get DV(){return DV},get V(){return V},SAVE,VO,
 tick(n,dt=1/60,hook){for(let i=0;i<n;i++){T+=dt;if(hook)hook();update(dt);pressed={};ptr.tap=false;ptr.abil=false;}render();return state;},
 press(c){pressed[c]=true;},hold(c,v){keys[c]=v;},tap(x,y){ptr.x=x;ptr.y=y;ptr.tap=true;}};
// ---- veri yükle ----
fetch('veri.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('veri');return r.json();}).then(d=>{V=d;startTitle();
 const tp=new URLSearchParams(location.search).get('test');if(tp)skipTo(tp);}).catch(e=>{loadErr=true;console.warn('veri.json yüklenemedi',e);});
</script>
