'use strict';

const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const W=960,H=540;let SC=1;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H)*.98;const d=Math.min(2,window.devicePixelRatio||1);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*d);cv.height=Math.floor(H*s*d);SC=cv.width/W;}
addEventListener('resize',resize);resize();
const TAU=Math.PI*2,PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,choice=a=>a[Math.random()*a.length|0];
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const OL='#2b1a10',FONT='"Trebuchet MS","Segoe UI",Verdana,sans-serif';

// ---------------- INPUT ----------------
const keys={};let pressed={};
const ptr={x:0,y:0,down:false,tap:false,lastTap:0,dbl:false};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();if(!keys[e.code])pressed[e.code]=true;keys[e.code]=true;AU.init();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();const p=toGame(e);ptr.x=p.x;ptr.y=p.y;ptr.down=true;ptr.tap=true;const n=performance.now();if(n-ptr.lastTap<320)ptr.dbl=true;ptr.lastTap=n;});
cv.addEventListener('pointermove',e=>{const p=toGame(e);ptr.x=p.x;ptr.y=p.y;});
addEventListener('pointerup',()=>ptr.down=false);
addEventListener('pointercancel',()=>ptr.down=false);
const hit=(...c)=>c.some(k=>pressed[k]);

// ---------------- AUDIO ----------------
const AU={c:null,muted:false,
init(){if(this.c){if(this.c.state==='suspended')this.c.resume();return;}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const c=this.c=new AC();
 this.m=c.createGain();this.m.gain.value=this.muted?0:.55;this.m.connect(c.destination);
 this.s=c.createGain();this.s.gain.value=.9;this.s.connect(this.m);
 this.mu=c.createGain();this.mu.gain.value=.15;this.mu.connect(this.m);
 const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
 if(MUS.want)MUS.start(MUS.want);
},
toggle(){this.muted=!this.muted;if(this.m)this.m.gain.value=this.muted?0:.55;if(this.muted)VO.hush();if(SONG.el){if(this.muted)SONG.el.pause();else if(SONG.ok)SONG.el.play().catch(()=>{});}},
tone(type,f0,f1,dur,vol=.3,delay=0,dest){const c=this.c;if(!c)return null;const t=c.currentTime+Math.max(0,delay);const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.02,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||this.s);o.start(t);o.stop(t+dur+.05);return o;},
noise(dur,vol,ft,f0,f1,delay=0,q=1,dest){const c=this.c;if(!c)return;const t=c.currentTime+Math.max(0,delay);const src=c.createBufferSource();src.buffer=this.nb;src.loop=true;const f=c.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f);f.connect(g);g.connect(dest||this.s);src.start(t,Math.random()*.5);src.stop(t+dur+.05);},
voice(dur,pitch){const c=this.c,t=c.currentTime;const o=c.createOscillator();o.type='sawtooth';const base=170*pitch;o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.8,t+dur*.3);o.frequency.linearRampToValueAtTime(base*1.5,t+dur*.7);o.frequency.linearRampToValueAtTime(base*.9,t+dur);const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(700,t);f.frequency.linearRampToValueAtTime(1300,t+dur*.4);f.frequency.linearRampToValueAtTime(600,t+dur);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.setValueAtTime(.4,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,t+dur);const l=c.createOscillator(),lg=c.createGain();l.frequency.value=7;lg.gain.value=base*.07;l.connect(lg);lg.connect(o.frequency);o.connect(f);f.connect(g);g.connect(this.s);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);},
play(n){if(!this.c)return;const r=Math.random;switch(n){
 case 'flap':this.noise(.16,.35,'bandpass',600,1800,0,1.5);break;
 case 'jump':this.tone('square',300,600,.15,.12);this.noise(.2,.3,'bandpass',500,2000);break;
 case 'squawk':this.tone('sawtooth',1400+r()*300,700,.16,.12);this.tone('sawtooth',1300,600,.14,.09,.18);break;
 case 'splash':this.noise(.9,.6,'lowpass',4000,150);this.tone('sine',500,80,.4,.3);break;
 case 'bonk':this.tone('sine',520+r()*120,70,.2,.5);this.noise(.07,.35,'lowpass',2500,400);break;
 case 'boing':this.tone('sine',160,640,.38,.45);this.tone('triangle',320,1280,.3,.08);break;
 case 'pickup':[660,880,1320].forEach((f,i)=>this.tone('square',f,f,.08,.1,i*.06));break;
 case 'dash':this.noise(.28,.4,'bandpass',300,3500,0,2);break;
 case 'meow':this.tone('triangle',650+r()*200,1100,.1,.12);this.tone('triangle',1100,500,.25,.12,.1);break;
 case 'whistle':{const o=this.tone('square',2300,2300,.6,.05);if(o){const l=this.c.createOscillator(),lg=this.c.createGain();l.frequency.value=28;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);l.start();l.stop(this.c.currentTime+.7);}break;}
 case 'slip':this.tone('sine',1000,140,.45,.25);break;
 case 'crash':this.noise(.6,.6,'lowpass',1800,100);this.tone('square',120,40,.4,.2);break;
 case 'pop':this.tone('sine',500,1300,.09,.3);break;
 case 'throw':this.noise(.15,.25,'highpass',1500,4000);break;
 case 'yell':this.voice(.7,1);break;
 case 'yellHigh':this.voice(.6,1.6);break;
 case 'gasp':this.voice(.25,1.3);break;
 case 'cricket':for(let i=0;i<6;i++)this.tone('sine',4400,4400,.04,.05,i*.09+(i>2?.4:0));break;
 case 'fanfare':[523,659,784,1046,784,1046].forEach((f,i)=>this.tone('square',f,f,i==5?.6:.14,.12,i*.13));break;
 case 'sad':[392,370,349,330].forEach((f,i)=>this.tone('sawtooth',f,i==3?f*.94:f,i==3?1.1:.38,.13,i*.42));break;
 case 'thud':this.tone('sine',140,40,.3,.6);this.noise(.3,.4,'lowpass',800,100);break;
 case 'eat':for(let i=0;i<3;i++)this.noise(.05,.2,'highpass',2000,3000,i*.1);break;
 case 'rumble':this.noise(1.6,.3,'lowpass',300,200);break;
 case 'drum':this.tone('sine',110,45,.25,.5);this.noise(.08,.2,'lowpass',1200,300);break;
 case 'clang':this.tone('square',1250,1180,.5,.1);this.tone('sine',2500,2380,.7,.12);this.noise(.1,.3,'highpass',3000,6000);break;
 case 'stamp':this.tone('sine',90,40,.35,.8);this.noise(.18,.5,'lowpass',1500,200);break;
 case 'whip':this.noise(.12,.5,'highpass',2500,6000);this.tone('square',900,200,.08,.1,.05);break;
 case 'splat':this.noise(.25,.45,'lowpass',2500,300);this.tone('sine',300,120,.15,.2);break;
 case 'laugh':for(let i=0;i<7;i++){this.tone('sawtooth',300-i*14,240-i*14,.09,.2,i*.12);this.noise(.06,.15,'bandpass',900,1200,i*.12,3);}break;
}}};
// ---- seslendirme: mırıltı sentezi + tarayıcının Türkçe sesi ----
AU.babble=function(text,pitch=1,rate=1){const c=this.c;if(!c||this.muted)return 0;
 const n=clamp(Math.round(text.replace(/[^a-zA-ZçğıöşüÇĞİÖŞÜ]/g,'').length/3.4),2,11);
 const FM=[[730,1090],[300,2200],[320,870],[530,1840],[600,1000]];
 let t=c.currentTime+.02;const base=140*pitch,st=t;
 for(let i=0;i<n;i++){const d=(.07+Math.random()*.05)/rate;const o=c.createOscillator();o.type='sawtooth';
  const f0=base*(1+Math.sin(i*2.1+pitch)*.16)*(i===n-1?.85:1);o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*rand(.88,1.15),t+d);
  const fm=choice(FM),g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  for(const [fq,q] of [[fm[0],5],[fm[1],7]]){const b=c.createBiquadFilter();b.type='bandpass';b.Q.value=q;b.frequency.value=fq*(.8+pitch*.2);o.connect(b);b.connect(g);}
  g.connect(this.s);o.start(t);o.stop(t+d+.03);t+=d+.02/rate;}
 return t-st;};
// [pitch, rate] her karakter için
const VP={hez:[1,1.05],teyze:[1.6,1.25],amca:[.6,.85],cocuk:[2,1.35],kasap:[.4,.95],bekci:[.9,1.2],balikci:[.75,1],hanim:[1.4,1.15],berber:[1.15,1.35],hamamci:[.55,.9],imam:[.7,.8],boss:[.3,.85],ulak:[1.1,1.25],gull:[2,1.6],fish:[.2,.8],carpet:[1.25,1.1],kaptan:[.6,1],karpuzcu:[1.3,1.45],evliya:[1,.9],ressam:[1.25,.95],anlatici:[.95,1.05],kiz:[1.8,1.1],padisah:[.55,.8]};
// ortak repliklerde konuşana göre oynatma hızı (perde de birlikte değişir)
const VRATE={teyze:1.25,hanim:1.18,cocuk:1.35,kiz:1.3,kasap:.85,amca:.9,bekci:1.08,balikci:.95,berber:1.12,hamamci:.88,imam:.9,boss:.82,ulak:1.05};
const VO={mode:(()=>{const v=localStorage.getItem('hez_vo');return v==null?2:+v;})(),tr:null,cur:0,until:0,man:null,aud:null,
 init(){fetch('voices/manifest.json').then(r=>r.ok?r.json():null).then(m=>{this.man=m;}).catch(()=>{});
  if(!('speechSynthesis' in window))return;const pick=()=>{const vs=speechSynthesis.getVoices();this.tr=vs.find(v=>/^tr([-_]|$)/i.test(v.lang))||null;};pick();speechSynthesis.onvoiceschanged=pick;},
 label(){return this.mode===0?'Kapalı':this.mode===1?'Mırıltı':this.man?'Aykut\'un sesi':(this.tr?'Gerçek ses':'Gerçek ses (Türkçe ses yok, mırıltı)');},
 hush(){if(this.aud)this.aud.pause();if(window.speechSynthesis)speechSynthesis.cancel();},
 cycle(){this.mode=this.mode===0?2:this.mode-1;localStorage.setItem('hez_vo',this.mode);if(this.mode<2)this.hush();},
 speak(who,text,pri=1){if(!this.mode||AU.muted||!AU.c)return;text=String(text);if(!/[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(text))return;
  const p=VP[who]||VP.anlatici,now=performance.now(),busy=this.aud&&!this.aud.paused&&!this.aud.ended;
  if(busy&&pri<=this.cur)return;
  if(this.mode===2&&this.man&&this.man[text]){const [f,o]=this.man[text];
   if(busy)this.aud.pause();if(window.speechSynthesis)speechSynthesis.cancel();
   const a=new Audio('voices/'+f+'.mp3');if(!o&&VRATE[who]){a.preservesPitch=false;a.mozPreservesPitch=false;a.webkitPreservesPitch=false;a.playbackRate=VRATE[who];}
   a.volume=1;a.play().catch(()=>{});this.aud=a;this.cur=pri;this.until=now;return;}
  if(busy)this.aud.pause();
  if(this.mode===2&&this.tr){const ss=speechSynthesis;if((ss.speaking||ss.pending)&&now<this.until+4000){if(pri<=this.cur)return;ss.cancel();}
   const u=new SpeechSynthesisUtterance(text.replace(/[→•…"]/g,' ').toLocaleLowerCase('tr-TR'));u.voice=this.tr;u.lang=this.tr.lang;u.pitch=clamp(p[0],0,2);u.rate=clamp(p[1],.5,2);u.volume=1;this.cur=pri;this.until=now;ss.speak(u);return;}
  if(now<this.until&&pri<=this.cur)return;this.cur=pri;this.until=now+AU.babble(text,.35+p[0]*.65,p[1])*1000;}
};
VO.init();
// music: hicaz makamı on D
const HZ=[0,1,4,5,7,8,10,12,13,16,17,19];
const nf=(d,p)=>(p&&p.root||293.66)*Math.pow(2,((p&&p.sc)||HZ)[d]/12);
const SCL={rast:[0,2,4,5,7,9,10,12,14,16,17,19],ussak:[0,1,3,5,7,8,10,12,13,15,17,19],nihavent:[0,2,3,5,7,8,10,12,14,15,17,19]};
const _=null;
const PATS={
 title:{bpm:96,mel:[4,_,5,4,2,_,1,2,3,_,2,1,0,_,_,_,4,5,6,7,6,5,4,_,5,4,2,1,2,_,_,_],bass:[0,_,_,_,0,_,_,_,3,_,_,_,0,_,_,_,4,_,_,_,3,_,_,_,1,_,_,_,0,_,_,_],drum:'D..tD.t.'},
 flight:{bpm:124,mel:[7,_,6,5,4,_,4,5,6,5,4,2,4,_,_,_,4,5,4,2,1,2,1,0,1,2,4,5,4,_,_,_],bass:[0,_,4,_,0,_,4,_,3,_,4,_,0,_,4,_,0,_,3,_,1,_,0,_,1,_,3,_,4,_,0,_],drum:'D.t.D.tt'},
 chase:{bpm:172,mel:[0,1,2,1,2,3,4,_,4,5,4,3,2,1,2,_,7,6,5,4,5,4,3,2,3,2,1,2,0,_,0,_],bass:[0,_,0,_,0,_,4,_,3,_,3,_,1,_,0,_,4,_,4,_,3,_,3,_,1,_,1,_,0,_,0,_],drum:'D.tDD.t.'},
 sunset:{bpm:112,sc:SCL.rast,root:261.63,mel:[0,2,4,_,5,4,2,_,4,5,7,_,5,4,2,_,7,_,6,5,4,_,2,4,5,4,2,1,0,_,_,_],bass:[0,_,_,_,3,_,_,_,4,_,_,_,0,_,_,_,4,_,_,_,3,_,_,_,1,_,_,_,0,_,_,_],drum:'D..tD.t.'},
 gece:{bpm:92,sc:SCL.ussak,root:261.63,mel:[7,_,6,_,5,_,3,_,4,_,3,1,0,_,_,_,3,4,5,_,7,_,8,7,5,_,3,_,1,_,0,_],bass:[0,_,_,_,0,_,_,_,3,_,_,_,0,_,_,_,3,_,_,_,4,_,_,_,1,_,_,_,0,_,_,_],drum:'D...t...'},
 cezayir:{bpm:134,root:220,mel:[0,1,2,1,4,_,2,1,0,1,2,4,5,4,2,_,4,5,7,5,4,2,1,2,0,_,1,_,0,_,_,_],bass:[0,_,0,4,0,_,0,4,3,_,3,4,0,_,0,_,4,_,4,3,1,_,1,0,0,_,0,_,0,_,_,_],drum:'D.tDt.t.'},
 boss:{bpm:188,sc:SCL.nihavent,root:220,mel:[0,_,0,1,2,_,0,_,4,_,3,2,1,_,0,_,0,_,0,1,2,_,4,_,5,4,3,2,1,_,1,_],bass:[0,_,0,_,0,_,0,_,3,_,3,_,4,_,4,_,0,_,0,_,0,_,0,_,5,_,4,_,3,_,1,_],drum:'DDt.DDtt'},
 saray:{bpm:100,sc:SCL.rast,root:293.66,mel:[0,_,2,_,4,_,4,5,4,_,2,_,0,_,_,_,4,_,5,_,7,_,7,5,4,_,2,_,4,_,_,_],bass:[0,_,_,_,0,_,_,_,3,_,_,_,4,_,_,_,0,_,_,_,3,_,_,_,4,_,_,_,0,_,_,_],drum:'D.D.DttD'},
};
// yerel özel şarkı (sadece bilgisayarda varsa çalar; yayındaki sitede dosya yok, sessizce atlanır)
const SONG={el:null,ok:false,init(){const a=new Audio("muzik/ozel.mp3");a.loop=true;a.preload="auto";a.volume=.45;a.addEventListener("canplaythrough",()=>{this.ok=true;MUS.on=false;if(AU.c&&!AU.muted)a.play().catch(()=>{});},{once:true});a.addEventListener("error",()=>{this.ok=false;});this.el=a;},
 play(){if(!this.ok||AU.muted)return;this.el.currentTime=0;this.el.play().catch(()=>{});},stop(){if(this.el&&!this.el.paused)this.el.pause();}};
SONG.init();
const MUS={on:false,want:null,
 start(n){this.want=n;if(SONG.ok){this.on=false;if(SONG.el.paused&&!AU.muted)SONG.el.play().catch(()=>{});return;}if(!AU.c)return;this.p=PATS[n];this.step=0;this.next=AU.c.currentTime+.05;this.on=true;},
 stop(){this.on=false;this.want=null;},
 tick(){if(!this.on||!AU.c)return;const c=AU.c,p=this.p,sd=60/p.bpm/2;if(this.next<c.currentTime)this.next=c.currentTime+.05;
  while(this.next<c.currentTime+.15){const i=this.step,dl=this.next-c.currentTime;
   const m=p.mel[i%p.mel.length];if(m!=null)AU.tone('square',nf(m,p),null,sd*.9,.16,dl,AU.mu);
   const b=p.bass[i%p.bass.length];if(b!=null)AU.tone('triangle',nf(b,p)/2,null,sd*1.8,.35,dl,AU.mu);
   const ch=p.drum[i%p.drum.length];if(ch==='D')AU.tone('sine',100,40,.2,.8,dl,AU.mu);else if(ch==='t')AU.noise(.05,.25,'highpass',3000,5000,dl,1,AU.mu);
   this.next+=sd;this.step++;}}
};
setInterval(()=>MUS.tick(),25);

// ---------------- DRAW PRIMITIVES ----------------
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);if(c)ctx.fillStyle=c;ctx.fill();}
function ell(x,y,rx,ry,c,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,Math.abs(rx)),Math.max(.1,Math.abs(ry)),rot,0,TAU);if(c)ctx.fillStyle=c;ctx.fill();}
function ln(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function drawStar(x,y,r,rot,c){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<10;i++){const a=i*PI/5-PI/2,q=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q);}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
function txt(s,x,y,size,color='#fff',align='center',stroke=OL,lw){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';if(stroke){ctx.lineWidth=lw||Math.max(3,size/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function wrap(text,maxW,font){ctx.font=font;const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

function drawWing(ang,col,L){
 ctx.save();ctx.rotate(ang);const tipY=-L*.14;
 ctx.beginPath();ctx.moveTo(2,-3);ctx.quadraticCurveTo(-L*.5,-L*.28,-L,tipY);
 const n=6;let px=-L,py=tipY;
 for(let i=1;i<=n;i++){const t=i/n;const nx=lerp(-L,2,t),ny=lerp(tipY+3,7,t);ctx.quadraticCurveTo((px+nx)/2,Math.max(py,ny)+11*(1-t*.5),nx,ny);px=nx;py=ny;}
 ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=2;ctx.stroke();
 ctx.strokeStyle='rgba(110,70,30,.45)';ctx.lineWidth=1.2;
 for(let i=1;i<n;i++){const t=i/n;const x=lerp(-L,2,t);ln(x*.92,lerp(tipY,-3,t)-L*.1*Math.sin(t*PI),x,lerp(tipY+3,7,t)+8);}
 ctx.strokeStyle='#7a4a22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(2,-3);ctx.quadraticCurveTo(-L*.5,-L*.28,-L,tipY);ctx.stroke();
 ctx.restore();
}
