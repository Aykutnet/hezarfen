<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarihle Şaka Olmaz</title>
<link rel="icon" type="image/png" href="img/simge.png">
<meta name="description" content="Oynarken güldüren, bittiğinde düşündüren oyunlar. Tarihin unutulmaz anlarını mizahla yeniden oyna.">
<meta property="og:title" content="Tarihle Şaka Olmaz">
<meta property="og:description" content="Oynarken güldüren, bittiğinde düşündüren oyunlar.">
<meta property="og:image" content="https://aykutnet.github.io/hezarfen/img/kapak.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--ol:#2b1a10;--altin:#e3b23c;--kahve:#7a5520;--yazi:#5a3a1a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-weight:700;color:var(--yazi);
  background:linear-gradient(180deg,#f3e2b8,#e9d09a 60%,#d9b878);background-attachment:fixed;display:flex;justify-content:center;padding:18px}
.cerceve{width:100%;max-width:1040px;border:6px solid #b8862f;border-radius:20px;padding:8px}
.ic{border:2px solid var(--kahve);border-radius:13px;padding:22px 22px 18px}
h1{margin:0;text-align:center;font-size:clamp(34px,7vw,64px);font-weight:900;color:#ffd166;letter-spacing:1px;
  -webkit-text-stroke:clamp(6px,1.1vw,10px) var(--ol);paint-order:stroke fill;animation:salla 4s ease-in-out infinite}
@keyframes salla{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.slogan{text-align:center;margin:8px 0 22px;font-size:clamp(14px,2.2vw,19px)}
.izgara{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:860px){.izgara{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.izgara{gap:10px}.ic{padding:14px 10px}.yakinda{top:62%;font-size:13px;padding:3px 12px}.ulke{font-size:10px}}
.kart{position:relative;display:flex;flex-direction:column;border:3px solid var(--kahve);border-radius:14px;overflow:hidden;background:#fbf1d8;
  box-shadow:4px 6px 0 rgba(60,35,10,.35);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.kart:hover,a.kart:focus-visible{transform:translateY(-3px) scale(1.03);border-color:var(--altin);outline:none}
.ust{position:relative;aspect-ratio:210/96;background-size:cover;background-position:center}
.harf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:rgba(255,255,255,.33)}
.ulke{position:absolute;left:8px;top:6px;font-size:11px;color:#fff;-webkit-text-stroke:3px var(--ol);paint-order:stroke fill}
.oyna{position:absolute;right:8px;bottom:6px;background:#c0392b;color:#fff;border:2px solid #fff;border-radius:12px;padding:3px 11px;font-size:13px}
.yakinda{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-7deg);background:rgba(30,20,10,.82);border:2px solid var(--altin);
  border-radius:8px;padding:4px 16px;color:#ffe066;font-size:15px;white-space:nowrap}
.kilitli .ust::after{content:"";position:absolute;inset:0;background:rgba(40,28,15,.18)}
.kilitli{cursor:default}
.alt{padding:7px 8px 10px;text-align:center;display:flex;flex-direction:column;gap:3px;flex:1}
.ad{font-size:19px;color:#ffd166;-webkit-text-stroke:4px var(--ol);paint-order:stroke fill}
.baslik{font-size:13px;color:#7a2c1b}
.is{font-size:11px;font-weight:400;line-height:1.3}
.kilitli .alt{background:#efe2c2}
.not{text-align:center;margin-top:18px;font-size:13px;font-weight:400}
.not a{color:#7a2c1b}
.mesaj{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(30,20,10,.9);border:2px solid var(--altin);border-radius:14px;
  padding:9px 18px;color:#ffe066;opacity:0;transition:opacity .25s;pointer-events:none}
.mesaj.gor{opacity:1}
</style>
</head>
<body>
<div class="cerceve"><div class="ic">
  <h1>TARİHLE ŞAKA OLMAZ</h1>
  <div class="slogan">Oynarken güldüren, bittiğinde düşündüren oyunlar.</div>
  <div class="izgara" id="izgara"></div>
  <div class="not">🎵 Şarkılar: <a href="https://www.youtube.com/playlist?list=PLMtxgvOk9Juc" target="_blank" rel="noopener">Hezarfen — Kanatlar Sırtında</a></div>
</div></div>
<div class="mesaj" id="mesaj"></div>
<script>
// Godot sürümündeki ortak/seri.gd ile aynı liste; yeni oyun hazır olunca "yol" eklenir
const OYUNLAR = [
  {id:"hezarfen",ad:"Hezarfen",alt:"Uçtun da Ne Oldu?",ulke:"İSTANBUL · 1632",is:"Boğaz'ı geç, mahalleliden kaç.",renk:["#2f6fa8","#9fd3f0"],resim:"img/hezarfen.jpg",yol:"hezarfen/"},
  {id:"figani",ad:"Figânî",alt:"Ben Yazmadım!",ulke:"İSTANBUL · 1532",is:"Şiir yüzünden Pargalı'dan kaç.",renk:["#7b2d26","#e8b04a"],resim:"img/figani.jpg",yol:"figani/"},
  {id:"takiyuddin",ad:"Takiyüddin",alt:"Teleskobu Sakla!",ulke:"İSTANBUL · 1580",is:"Rasathaneyi kurtarmaya çalış.",renk:["#1b2a5a","#7f8fd6"]},
  {id:"galileo",ad:"Galileo",alt:"Vallahi Dönüyor!",ulke:"İTALYA · 1633",is:"Engizisyon karşısında Dünya'nın döndüğünü kanıtla.",renk:["#5a3e1b","#d8b26e"]},
  {id:"salem",ad:"Salem",alt:"Ben Cadı Değilim!",ulke:"ABD · 1692",is:"Her hareketinden şüphelenen kasabalıları ikna et.",renk:["#2d3b2a","#9bbf7a"]},
  {id:"semmelweis",ad:"Semmelweis",alt:"Yıka Şu Elini!",ulke:"AVUSTURYA · 1847",is:"Doktorlara zorla el yıkatmaya çalış.",renk:["#22545e","#9fe0e0"]},
  {id:"emu",ad:"Emu Savaşı",alt:"Kuşlara Yenildik!",ulke:"AVUSTRALYA · 1932",is:"Avustralya ordusunu emulara karşı yönet.",renk:["#8a4b1c","#f0c27a"]},
  {id:"bruno",ad:"Bruno",alt:"Keşke Susaydım!",ulke:"İTALYA · 1600",is:"Fikirlerin yüzünden başına açılan belalardan kurtul.",renk:["#3e1f47","#c58fd6"]},
];
const izgara = document.getElementById("izgara"), mesaj = document.getElementById("mesaj");
const kacis = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mt;
for (const o of OYUNLAR) {
  const acik = !!o.yol;
  const el = document.createElement(acik ? "a" : "div");
  el.className = "kart" + (acik ? "" : " kilitli");
  if (acik) el.href = o.yol;
  else el.addEventListener("click", () => { mesaj.textContent = o.ad + " yakında geliyor!"; mesaj.classList.add("gor"); clearTimeout(mt); mt = setTimeout(() => mesaj.classList.remove("gor"), 1800); });
  const ust = o.resim ? `background-image:url('${o.resim}')` : `background:linear-gradient(180deg,${o.renk[1]},${o.renk[0]})`;
  el.innerHTML = `<div class="ust" style="${ust}">${o.resim ? "" : `<div class="harf">${kacis(o.ad[0])}</div>`}
      <div class="ulke">${kacis(o.ulke)}</div>${acik ? '<div class="oyna">OYNA</div>' : '<div class="yakinda">YAKINDA</div>'}</div>
    <div class="alt"><div class="ad">${kacis(o.ad)}</div><div class="baslik">${kacis(o.alt)}</div><div class="is">${kacis(o.is)}</div></div>`;
  izgara.appendChild(el);
}
</script>
</body>
</html>
